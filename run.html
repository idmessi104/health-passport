<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Health Passport | อัพเกรด</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<style>
  body { background: #f0fdf4; font-family: sans-serif; }
  .card { background: white; border-radius: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

/* CONFIG */
const firebaseConfig = { /* วาง config ของคุณที่นี่ */ };
const TEACHER_PASSWORD = '111111';
const TASKS_PATH = 'tasks';
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* DATA STRUCTURE */
const ACTIVITIES = [
  { id:'run', name:'วิ่งสะสมระยะ', met:8.0, icon:'fa-person-running', color:'bg-sky-500' },
  { id:'sport', name:'เล่นกีฬา', met:6.5, icon:'fa-basketball', color:'bg-amber-500' },
  { id:'dance', name:'Dancing', met:5.5, icon:'fa-music', color:'bg-rose-500' },
  { id:'family', name:'Sport Family', met:5.0, icon:'fa-people-roof', color:'bg-emerald-600' } // อัปเกรด MET
];

/* APP */
function App() {
  const [user, setUser] = useState(null);
  const [tasks, setTasks] = useState([]);
  const [activeTab, setActiveTab] = useState('home');
  const [selectedClass, setSelectedClass] = useState('ม.1');

  // Login States
  const [loginMode, setLoginMode] = useState('student');
  const [fName, setFName] = useState('');
  const [fNo, setFNo] = useState('');
  const [fGrade, setFGrade] = useState('ม.1');
  const [fPass, setFPass] = useState('');

  useEffect(() => {
    db.collection(TASKS_PATH).onSnapshot(s => setTasks(s.docs.map(d=>({id:d.id, ...d.data()}))));
  }, []);

  const handleLogin = () => {
    if(loginMode === 'teacher') {
      if(fPass !== TEACHER_PASSWORD) return alert('รหัสผ่านผิด');
      setUser({ role: 'teacher' });
    } else {
      if(!fName || !fNo) return alert('กรุณากรอกข้อมูลให้ครบ');
      setUser({ role: 'student', name: fName, no: fNo, grade: fGrade });
    }
  };

  /* Logic คำนวณ HP */
  const calculateHP = (task) => {
    const act = ACTIVITIES.find(a => a.id === task.activityId);
    if (!act || task.duration < 600) return 0; // 10 นาที
    const minutes = task.duration / 60;
    return (act.met * minutes) / 10;
  };

  /* คำนวณคะแนน 10 คะแนน */
  const getGradeScore = (stuName) => {
    const myTasks = tasks.filter(t => t.studentName === stuName && t.status === 'approved');
    let totalHP = 0;
    // ปรับใช้เกณฑ์: 30HP=1คะแนน, เพดานวัน 30, เพดานสัปดาห์ 90
    totalHP = myTasks.reduce((sum, t) => sum + calculateHP(t), 0);
    const scoreA = Math.min(7, Math.floor(totalHP / 30));
    // (B และ C สามารถเพิ่ม logic สม่ำเสมอและความหลากหลายได้ที่นี่)
    return { totalHP, scoreA };
  };

  /* RENDER */
  if(!user) return (
    <div className="p-6 max-w-sm mx-auto">
      <h1 className="text-2xl font-bold mb-4">Health Passport</h1>
      <div className="card p-4 space-y-3">
        <select onChange={e=>setLoginMode(e.target.value)} className="w-full p-2 border rounded">
          <option value="student">นักเรียน</option>
          <option value="teacher">คุณครู</option>
        </select>
        {loginMode === 'student' ? (
          <>
            <input placeholder="ชื่อ-นามสกุล" className="w-full p-2 border rounded" onChange={e=>setFName(e.target.value)}/>
            <input placeholder="เลขที่" className="w-full p-2 border rounded" onChange={e=>setFNo(e.target.value)}/>
            <select className="w-full p-2 border rounded" onChange={e=>setFGrade(e.target.value)}>
              <option>ม.1</option><option>ม.2</option><option>ม.3</option>
            </select>
          </>
        ) : <input type="password" placeholder="รหัสผ่านครู" className="w-full p-2 border rounded" onChange={e=>setFPass(e.target.value)}/> }
        <button onClick={handleLogin} className="w-full bg-emerald-600 text-white p-2 rounded">เข้าสู่ระบบ</button>
      </div>
    </div>
  );

  return (
    <div className="p-4 pb-20">
      {user.role === 'teacher' ? (
        <div>
          <h2 className="text-xl font-bold mb-4">คะแนนนักเรียน</h2>
          <select className="mb-4 p-2 border rounded" onChange={e=>setSelectedClass(e.target.value)}>
            <option>ม.1</option><option>ม.2</option><option>ม.3</option>
          </select>
          {/* แสดงรายการนักเรียนและคะแนนที่ Filter ตาม selectedClass */}
        </div>
      ) : (
        <div>
          <h2 className="text-xl font-bold">สวัสดี {user.name} ({user.grade})</h2>
          {/* แสดงสถานะ HP และปุ่มบันทึกกิจกรรม */}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
