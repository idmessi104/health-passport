<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Health Passport</title>
    
    <!-- เครื่องมือเสริมทั้งหมด -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        // 🔥 กุญแจ FIREBASE ของคุณ 🔥
        const firebaseConfig = {
            apiKey: "AIzaSyD86PLSeOfkyVV8rCpc426G6MbEM_7Y4LU",
            authDomain: "health-passport-school.firebaseapp.com",
            projectId: "health-passport-school",
            storageBucket: "health-passport-school.firebasestorage.app",
            messagingSenderId: "282808112905",
            appId: "1:282808112905:web:6a852eb4de9b9e146e65d8",
            measurementId: "G-93S8363Z6Q"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();
        const APP_ID = 'health-passport';
        const TASKS_PATH = `artifacts/${APP_ID}/public/data/tasks`;

        const { useState, useEffect, useRef } = React;

        const ACTIVITIES = [
            { id: 1, title: 'Walk Challenge', desc: 'เดินสะสม 10,000 ก้าว', icon: 'fa-shoe-prints', points: 10, color: 'bg-blue-100 text-blue-600' },
            { id: 2, title: 'Bike Day', desc: 'ปั่นจักรยาน 30 นาที', icon: 'fa-bicycle', points: 15, color: 'bg-green-100 text-green-600' },
            { id: 3, title: 'Family Sport', desc: 'เล่นกีฬากับครอบครัว', icon: 'fa-users', points: 20, color: 'bg-orange-100 text-orange-600' },
            { id: 4, title: 'Healthy Cooking', desc: 'ทำเมนูสุขภาพ 1 มื้อ', icon: 'fa-utensils', points: 15, color: 'bg-red-100 text-red-600' },
            { id: 5, title: 'Nature Walk', desc: 'เดินสำรวจพรรณไม้', icon: 'fa-leaf', points: 10, color: 'bg-emerald-100 text-emerald-600' },
            { id: 6, title: 'Yoga Together', desc: 'โยคะยืดเหยียด', icon: 'fa-face-smile', points: 15, color: 'bg-purple-100 text-purple-600' },
            { id: 7, title: 'Mini Marathon', desc: 'วิ่งมินิมาราธอน', icon: 'fa-medal', points: 30, color: 'bg-yellow-100 text-yellow-600' },
            { id: 8, title: 'Dance Challenge', desc: 'เต้นแอโรบิค', icon: 'fa-music', points: 15, color: 'bg-pink-100 text-pink-600' }
        ];

        function App() {
            const [user, setUser] = useState(null);
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [role, setRole] = useState('student');
            const [studentName, setStudentName] = useState('');
            const [inputName, setInputName] = useState('');
            const [teacherPassword, setTeacherPassword] = useState('');

            const [activeTab, setActiveTab] = useState('home');
            const [selectedActivity, setSelectedActivity] = useState(null);
            const [selectedImageBase64, setSelectedImageBase64] = useState(null);
            const [showNotification, setShowNotification] = useState({ show: false, msg: '', type: 'success' });
            const [isLoading, setIsLoading] = useState(false);
            const fileInputRef = useRef(null);
            const [allTasks, setAllTasks] = useState([]);

            useEffect(() => {
                auth.signInAnonymously().catch(err => console.error(err));
                const unsubscribe = auth.onAuthStateChanged(setUser);
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubscribe = db.collection(TASKS_PATH)
                    .onSnapshot(snapshot => {
                        const tasksData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        tasksData.sort((a, b) => b.createdAt - a.createdAt);
                        setAllTasks(tasksData);
                    }, err => console.error(err));
                return () => unsubscribe();
            }, [user]);

            const pendingTasks = allTasks.filter(t => t.status === 'pending');
            
            // ดึงคะแนนโดยอ้างอิงจาก "ชื่อ-นามสกุล" ทำให้คะแนนไม่หายเมื่อปิดแอป
            const myApprovedTasks = allTasks.filter(t => t.status === 'approved' && t.studentName === studentName);
            const myPoints = myApprovedTasks.reduce((sum, task) => sum + task.points, 0);

            const notify = (msg, type = 'success') => {
                setShowNotification({ show: true, msg, type });
                setTimeout(() => setShowNotification({ show: false, msg: '', type: 'success' }), 3000);
            };

            const getLevel = (points) => {
                if (points >= 100) return { name: 'Gold Rank', color: 'text-yellow-600 bg-yellow-100' };
                if (points >= 50) return { name: 'Silver Rank', color: 'text-slate-500 bg-slate-100' };
                return { name: 'Bronze Rank', color: 'text-orange-600 bg-orange-100' };
            };

            const handleLogin = (selectedRole) => {
                if (selectedRole === 'student') {
                    if (inputName.trim() === '') return notify('กรุณาใส่ชื่อของคุณ', 'error');
                    setStudentName(inputName.trim());
                }
                
                if (selectedRole === 'teacher' && teacherPassword !== '191919') {
                    return notify('รหัสผ่านไม่ถูกต้อง!', 'error');
                }

                setRole(selectedRole);
                setIsLoggedIn(true);
                setActiveTab('home');
                setTeacherPassword('');
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 400;
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        setSelectedImageBase64(canvas.toDataURL('image/jpeg', 0.6));
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const handleSubmitPhoto = async () => {
                if (!selectedImageBase64) return notify('กรุณาแนบรูปภาพ', 'error');
                if (!user) return notify('ระบบยังไม่พร้อม รอสักครู่', 'error');
                setIsLoading(true);
                try {
                    await db.collection(TASKS_PATH).add({
                        studentName: studentName, // ผูกกับชื่อนักเรียน
                        activity: selectedActivity.title,
                        points: selectedActivity.points,
                        imgBase64: selectedImageBase64,
                        status: 'pending',
                        time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
                        createdAt: Date.now()
                    });
                    notify('ส่งงานสำเร็จ! รอครูอนุมัติ');
                    setSelectedImageBase64(null);
                    setSelectedActivity(null);
                    setActiveTab('home');
                } catch (error) {
                    notify('เกิดข้อผิดพลาดในการส่ง', 'error');
                }
                setIsLoading(false);
            };

            const handleApprove = async (taskId) => {
                try {
                    await db.collection(TASKS_PATH).doc(taskId).update({ status: 'approved' });
                    notify('อนุมัติเรียบร้อย');
                } catch (error) { notify('เกิดข้อผิดพลาด', 'error'); }
            };

            const handleReject = async (taskId) => {
                try {
                    await db.collection(TASKS_PATH).doc(taskId).update({ status: 'rejected' });
                    notify('ปฏิเสธหลักฐานแล้ว', 'error');
                } catch (error) { notify('เกิดข้อผิดพลาด', 'error'); }
            };

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen bg-gray-100 flex justify-center items-center p-4">
                        <div className="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden p-8 text-center border-t-8 border-[#06C755]">
                            <div className="w-24 h-24 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-6">
                                <i className="fa-solid fa-heart-pulse text-[#06C755] text-4xl"></i>
                            </div>
                            <h1 className="text-2xl font-black text-gray-800 mb-2">Health Passport</h1>
                            <p className="text-gray-500 mb-6 text-sm">ระบบสะสมแต้มออนไลน์</p>

                            {!user ? (
                                <div className="animate-pulse flex justify-center py-4 text-green-600 font-bold">กำลังเชื่อมต่อระบบ...</div>
                            ) : (
                                <div className="space-y-4">
                                    <div className="bg-gray-50 p-4 rounded-xl border border-gray-200">
                                        <p className="text-sm font-bold text-gray-700 text-left mb-2">สำหรับนักเรียน:</p>
                                        <input 
                                            type="text" 
                                            placeholder="พิมพ์ชื่อจริง หรือชื่อเล่น..." 
                                            value={inputName} 
                                            onChange={(e) => setInputName(e.target.value)} 
                                            className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-green-500 mb-3 font-bold" 
                                        />
                                        <button onClick={() => handleLogin('student')} className="w-full bg-[#06C755] text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 active:scale-95 transition-transform">
                                            <i className="fa-solid fa-user"></i> เข้าสู่ระบบนักเรียน
                                        </button>
                                    </div>
                                    
                                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                        <p className="text-sm font-bold text-gray-700 text-left mb-2">สำหรับคุณครู (ผู้ตรวจสอบ):</p>
                                        <input 
                                            type="password" 
                                            placeholder="ใส่รหัสผ่านเพื่อตรวจงาน..." 
                                            value={teacherPassword} 
                                            onChange={(e) => setTeacherPassword(e.target.value)} 
                                            className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-slate-500 mb-3" 
                                        />
                                        <button onClick={() => handleLogin('teacher')} className="w-full bg-slate-800 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 active:scale-95 transition-transform">
                                            <i className="fa-solid fa-shield-halved"></i> เข้าสู่ระบบคุณครู
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            const userLevel = getLevel(myPoints);

            return (
                <div className="min-h-screen bg-gray-100 flex justify-center items-start p-0 sm:p-4 font-sans sm:items-center">
                    <div className="w-full max-w-md bg-white sm:rounded-[2rem] shadow-2xl overflow-hidden flex flex-col h-screen sm:h-[850px] sm:max-h-[90vh] relative">
                        <div className="bg-gradient-to-br from-green-500 to-emerald-700 px-6 pt-10 pb-8 sm:rounded-b-[2rem] shadow-md z-10 relative text-white">
                            <button onClick={() => setIsLoggedIn(false)} className="absolute top-6 right-6 p-2 bg-white/20 rounded-full hover:bg-white/30 backdrop-blur-sm">
                                <i className="fa-solid fa-right-from-bracket"></i>
                            </button>
                            <div className="flex items-center gap-3 mb-6">
                                <div className="w-12 h-12 bg-white rounded-full flex items-center justify-center text-green-600 shadow-inner text-xl">
                                    <i className={`fa-solid ${role === 'student' ? 'fa-user' : 'fa-shield-halved'}`}></i>
                                </div>
                                <div>
                                    <p className="text-sm font-medium opacity-90">{role === 'student' ? 'นักเรียน' : 'โหมดผู้ตรวจ'}</p>
                                    <h2 className="text-xl font-bold">{role === 'student' ? studentName : 'คุณครู แอดมิน'}</h2>
                                </div>
                            </div>
                            {role === 'student' && activeTab === 'home' && (
                                <div className="bg-white/10 backdrop-blur-md rounded-2xl p-5 border border-white/20">
                                    <div className="flex justify-between items-center mb-1">
                                        <span className="text-white/80 text-sm font-medium">คะแนนสะสม</span>
                                        <span className={`flex items-center gap-1 text-xs font-bold px-2 py-1 rounded-full ${userLevel.color}`}>
                                            <i className="fa-solid fa-award"></i> {userLevel.name}
                                        </span>
                                    </div>
                                    <div className="flex items-baseline gap-1 text-white mb-2">
                                        <span className="text-5xl font-black">{myPoints}</span><span className="text-lg font-bold opacity-80">แต้ม</span>
                                    </div>
                                    <div className="bg-black/20 rounded-full h-2 overflow-hidden">
                                        <div className="bg-white h-full rounded-full transition-all duration-700" style={{ width: `${Math.min((myPoints / 100) * 100, 100)}%` }}></div>
                                    </div>
                                </div>
                            )}
                            {role === 'teacher' && (
                                <div className="text-center py-4 bg-white/10 backdrop-blur-md rounded-2xl border border-white/20">
                                    <div className="text-5xl font-black mb-1">{pendingTasks.length}</div>
                                    <p className="text-sm opacity-90">งานรออนุมัติทั้งหมด</p>
                                </div>
                            )}
                        </div>

                        <div className="flex-1 overflow-y-auto bg-slate-50 p-6 -mt-4 pt-8 pb-24">
                            {role === 'student' && activeTab === 'home' && (
                                <div>
                                    <h2 className="text-lg font-bold text-gray-800 mb-4">ภารกิจ 8 ฐานสุขภาพ</h2>
                                    <div className="grid grid-cols-2 gap-3">
                                        {ACTIVITIES.map((act) => (
                                            <button key={act.id} onClick={() => { setSelectedActivity(act); setActiveTab('submit'); }} className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center text-center hover:border-green-300 transition-colors active:scale-95">
                                                <div className={`w-12 h-12 rounded-full flex items-center justify-center mb-3 text-xl ${act.color}`}>
                                                    <i className={`fa-solid ${act.icon}`}></i>
                                                </div>
                                                <h3 className="text-sm font-bold text-gray-800 mb-1 leading-tight h-10 flex items-center">{act.title}</h3>
                                                <div className="mt-2 bg-green-50 text-green-600 text-[11px] font-bold px-3 py-1 rounded-full w-full">+{act.points} แต้ม</div>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}
                            {role === 'student' && activeTab === 'submit' && selectedActivity && (
                                <div>
                                    <button onClick={() => { setActiveTab('home'); setSelectedImageBase64(null); }} className="flex items-center text-gray-500 mb-4 font-medium bg-white px-3 py-1.5 rounded-full shadow-sm">
                                        <i className="fa-solid fa-arrow-left mr-2"></i> ย้อนกลับ
                                    </button>
                                    <div className="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 text-center mb-6 relative overflow-hidden">
                                        <div className={`w-16 h-16 mx-auto rounded-full flex items-center justify-center mb-3 text-2xl ${selectedActivity.color}`}>
                                            <i className={`fa-solid ${selectedActivity.icon}`}></i>
                                        </div>
                                        <h2 className="text-xl font-bold text-gray-800">{selectedActivity.title}</h2>
                                        <p className="text-gray-500 text-sm mb-4">{selectedActivity.desc}</p>
                                        <input type="file" accept="image/*" className="hidden" ref={fileInputRef} onChange={handleImageUpload} />
                                        <div onClick={() => fileInputRef.current.click()} className={`border-2 border-dashed rounded-2xl mb-6 cursor-pointer overflow-hidden transition-all flex flex-col items-center justify-center min-h-[200px] relative ${selectedImageBase64 ? 'border-green-400 p-0' : 'border-gray-300 bg-gray-50 hover:bg-gray-100 p-4'}`}>
                                            {selectedImageBase64 ? <img src={selectedImageBase64} alt="Preview" className="w-full h-full object-cover absolute inset-0" /> : <><i className="fa-solid fa-camera text-4xl text-gray-400 mb-2"></i><p className="text-sm font-bold text-gray-600">กดเพื่อถ่ายรูป / เลือกรูป</p></>}
                                        </div>
                                        <button onClick={handleSubmitPhoto} disabled={isLoading} className={`w-full ${isLoading ? 'bg-gray-400' : 'bg-green-500 hover:bg-green-600'} text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-95 flex justify-center items-center gap-2`}>
                                            {isLoading ? 'กำลังส่งข้อมูล...' : <><i className="fa-solid fa-circle-check"></i> ส่งหลักฐานขอรับคะแนน</>}
                                        </button>
                                    </div>
                                </div>
                            )}
                            {role === 'student' && activeTab === 'reward' && (
                                <div>
                                    <h2 className="text-lg font-bold text-gray-800 mb-4">ประวัติการรับแต้ม (ที่อนุมัติแล้ว)</h2>
                                    {myApprovedTasks.length === 0 ? (
                                        <div className="bg-white p-6 rounded-2xl text-center text-gray-500 border border-gray-100">ยังไม่มีประวัติ เริ่มทำกิจกรรมเลย!</div>
                                    ) : (
                                        <div className="space-y-3">
                                            {myApprovedTasks.map((t) => (
                                                <div key={t.id} className="bg-white p-4 rounded-2xl shadow-sm border border-green-100 flex justify-between items-center">
                                                    <div className="flex items-center gap-3">
                                                        <div className="bg-green-100 text-green-600 w-8 h-8 flex items-center justify-center rounded-full"><i className="fa-solid fa-circle-check"></i></div>
                                                        <div>
                                                            <p className="text-sm font-bold text-gray-800">{t.activity}</p>
                                                            <p className="text-[10px] text-gray-400 flex items-center gap-1"><i className="fa-solid fa-clock"></i> {t.time}</p>
                                                        </div>
                                                    </div>
                                                    <span className="text-green-600 font-bold bg-green-50 px-2 py-1 rounded-lg text-sm">+{t.points}</span>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}
                            {role === 'teacher' && (
                                <div>
                                    <h2 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2"><i className="fa-solid fa-shield-halved text-emerald-600"></i> ตรวจสอบหลักฐาน</h2>
                                    {pendingTasks.length === 0 ? (
                                        <div className="bg-white p-10 rounded-3xl shadow-sm border border-gray-100 text-center">
                                            <div className="w-16 h-16 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-3 text-3xl"><i className="fa-solid fa-circle-check text-green-400"></i></div>
                                            <h3 className="font-bold text-gray-700">ไม่มีงานค้าง</h3>
                                        </div>
                                    ) : (
                                        <div className="space-y-4">
                                            {pendingTasks.map(task => (
                                                <div key={task.id} className="bg-white p-5 rounded-3xl shadow-sm border border-gray-200">
                                                    <div className="flex justify-between items-start mb-3">
                                                        <div>
                                                            <p className="font-bold text-gray-800">{task.studentName}</p>
                                                            <p className="text-[10px] text-gray-400 mt-1 flex items-center gap-1"><i className="fa-solid fa-clock"></i> {task.time}</p>
                                                        </div>
                                                        <span className="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2 py-1 rounded-md">{task.activity}</span>
                                                    </div>
                                                    <div className="bg-gray-100 h-48 rounded-2xl overflow-hidden mb-4 border border-gray-200 relative group">
                                                        {task.imgBase64 ? <img src={task.imgBase64} alt="Evidence" className="w-full h-full object-contain bg-black" /> : <div className="w-full h-full flex items-center justify-center text-gray-400">ไม่มีรูปภาพ</div>}
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <button onClick={() => handleReject(task.id)} className="flex-1 flex justify-center items-center gap-1 bg-white border-2 border-red-100 text-red-500 font-bold py-3 rounded-xl hover:bg-red-50 active:scale-95 transition-all"><i className="fa-solid fa-circle-xmark"></i> ไม่อนุมัติ</button>
                                                        <button onClick={() => handleApprove(task.id)} className="flex-[2] flex justify-center items-center gap-1 bg-green-500 text-white font-bold py-3 rounded-xl hover:bg-green-600 active:scale-95 transition-all shadow-md shadow-green-200"><i className="fa-solid fa-circle-check"></i> อนุมัติ +{task.points}</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                        {role === 'student' && (
                            <div className="absolute bottom-0 w-full bg-white border-t border-gray-100 px-6 py-3 flex justify-around items-center z-20 pb-safe">
                                <button onClick={() => { setActiveTab('home'); setSelectedActivity(null); }} className={`flex flex-col items-center gap-1 w-16 transition-colors ${activeTab === 'home' || activeTab === 'submit' ? 'text-green-600' : 'text-gray-400'}`}>
                                    <div className={`p-2 rounded-xl text-xl transition-colors ${activeTab === 'home' || activeTab === 'submit' ? 'bg-green-50' : ''}`}><i className="fa-solid fa-shoe-prints"></i></div>
                                    <span className="text-[10px] font-bold">กิจกรรม</span>
                                </button>
                                <button onClick={() => setActiveTab('reward')} className={`flex flex-col items-center gap-1 w-16 transition-colors ${activeTab === 'reward' ? 'text-green-600' : 'text-gray-400'}`}>
                                    <div className={`p-2 rounded-xl text-xl transition-colors ${activeTab === 'reward' ? 'bg-green-50' : ''}`}><i className="fa-solid fa-trophy"></i></div>
                                    <span className="text-[10px] font-bold">ประวัติแต้ม</span>
                                </button>
                            </div>
                        )}
                        {showNotification.show && (
                            <div className="absolute top-4 left-1/2 transform -translate-x-1/2 z-50">
                                <div className={`${showNotification.type === 'error' ? 'bg-red-500' : 'bg-slate-800'} text-white px-4 py-3 rounded-2xl shadow-xl text-sm font-bold flex items-center gap-2 w-max`}>
                                    <i className={`fa-solid ${showNotification.type === 'error' ? 'fa-circle-xmark' : 'fa-circle-check'}`}></i>
                                    {showNotification.msg}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
