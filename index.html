<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Health Passport</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f8fafc; }
        .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 15px); }
        .pulse-ring { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        /* ตกแต่งกล่องถ่ายรูป */
        .upload-box { transition: all 0.2s; }
        .upload-box.active { border-color: #10b981; background-color: #ecfdf5; cursor: pointer; }
        .upload-box.disabled { border-color: #e2e8f0; background-color: #f8fafc; opacity: 0.6; cursor: not-allowed; }
        .upload-box.completed { border-color: #10b981; background-color: #fff; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyD86PLSeOfkyVV8rCpc426G6MbEM_7Y4LU",
            authDomain: "health-passport-school.firebaseapp.com",
            projectId: "health-passport-school",
            storageBucket: "health-passport-school.firebasestorage.app",
            messagingSenderId: "282808112905",
            appId: "1:282808112905:web:6a852eb4de9b9e146e65d8"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const APP_ID = 'health-passport-final'; // เปลี่ยน Path ฐานข้อมูลใหม่ให้คลีนๆ
        const TASKS_PATH = `artifacts/${APP_ID}/public/data/tasks`;

        const { useState, useEffect, useRef } = React;

        // โครงสร้าง 4 กิจกรรม
        const ACTIVITIES = [
            { id: 'run', title: 'วิ่งสะสมระยะ', type: 'gps', icon: 'fa-person-running', points: 15, color: 'text-emerald-500 bg-emerald-50' },
            { id: 'family', title: 'Sport Family', type: 'photo2', icon: 'fa-people-group', points: 20, color: 'text-orange-500 bg-orange-50' },
            { id: 'sport', title: 'เล่นกีฬา', type: 'photo2', icon: 'fa-basketball', points: 15, color: 'text-blue-500 bg-blue-50' },
            { id: 'dance', title: 'Dancing', type: 'photo2', icon: 'fa-music', points: 15, color: 'text-purple-500 bg-purple-50' }
        ];

        // ฟังก์ชันบีบอัดรูป
        const compressImage = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX = 500;
                        const scale = MAX / img.width;
                        canvas.width = MAX; canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        };

        const getDistance = (lat1, lon1, lat2, lon2) => {
            const R = 6371; const dLat = (lat2 - lat1) * (Math.PI / 180); const dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * Math.sin(dLon / 2) * Math.sin(dLon / 2); 
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)); 
        };

        const formatTime = (secs) => `${Math.floor(secs / 60).toString().padStart(2, '0')}:${(secs % 60).toString().padStart(2, '0')}`;

        function App() {
            const [user, setUser] = useState(null);
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [role, setRole] = useState('student');
            const [studentName, setStudentName] = useState('');
            const [inputName, setInputName] = useState('');
            const [teacherPassword, setTeacherPassword] = useState('');
            const [activeTab, setActiveTab] = useState('home'); 
            
            const [allTasks, setAllTasks] = useState([]);
            const [showNotif, setShowNotif] = useState({ show: false, msg: '', type: 'success' });
            const [isLoading, setIsLoading] = useState(false);
            const [selectedAct, setSelectedAct] = useState(null);

            // State วิ่ง GPS
            const [isTracking, setIsTracking] = useState(false);
            const [distance, setDistance] = useState(0);
            const [elapsedTime, setElapsedTime] = useState(0);

            // State ถ่ายรูป 2 ใบ
            const [imgBefore, setImgBefore] = useState(null);
            const [imgAfter, setImgAfter] = useState(null);
            const [timeBefore, setTimeBefore] = useState(null); 
            const [timeAfter, setTimeAfter] = useState(null);   
            const [timeDiffMinutes, setTimeDiffMinutes] = useState(0);

            const watchIdRef = useRef(null);
            const timerRef = useRef(null);
            const lastPosRef = useRef(null);
            const fileInputRef1 = useRef(null);
            const fileInputRef2 = useRef(null);

            useEffect(() => {
                auth.signInAnonymously().catch(console.error);
                return auth.onAuthStateChanged(setUser);
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsub = db.collection(TASKS_PATH).onSnapshot(snap => {
                    const data = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    data.sort((a, b) => b.createdAt - a.createdAt);
                    setAllTasks(data);
                });
                return unsub;
            }, [user]);

            const notify = (msg, type = 'success') => {
                setShowNotif({ show: true, msg, type });
                setTimeout(() => setShowNotif({ show: false, msg: '', type: '' }), 3000);
            };

            const handleLogin = (r) => {
                if (r === 'student') {
                    if (!inputName.trim()) return notify('กรุณาใส่ชื่อ-นามสกุล', 'error');
                    setStudentName(inputName.trim());
                } else {
                    if (teacherPassword !== '191919') return notify('รหัสผ่านครูผิด!', 'error');
                }
                setRole(r);
                setIsLoggedIn(true);
                setActiveTab(r === 'student' ? 'home' : 'review');
                setTeacherPassword('');
            };

            const startRunning = () => {
                if (!navigator.geolocation) return notify('มือถือไม่รองรับ GPS', 'error');
                setIsTracking(true); setDistance(0); setElapsedTime(0); lastPosRef.current = null;
                timerRef.current = setInterval(() => setElapsedTime(p => p + 1), 1000);
                watchIdRef.current = navigator.geolocation.watchPosition(
                    (pos) => {
                        if (pos.coords.accuracy > 30) return; 
                        const cLat = pos.coords.latitude; const cLon = pos.coords.longitude;
                        if (lastPosRef.current) {
                            const d = getDistance(lastPosRef.current.lat, lastPosRef.current.lon, cLat, cLon);
                            if (d > 0.003 && d < 0.05) setDistance(p => p + d);
                        }
                        lastPosRef.current = { lat: cLat, lon: cLon };
                    },
                    console.error,
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            };

            const stopRunning = () => {
                setIsTracking(false); clearInterval(timerRef.current); navigator.geolocation.clearWatch(watchIdRef.current);
                if (distance < 0.1) {
                    setDistance(0); setElapsedTime(0);
                    return notify('ระยะทางน้อยไป ไม่ถูกบันทึก (ต้องเกิน 100 เมตร)', 'error');
                }
                submitTask({
                    type: 'gps', distanceKm: distance, durationSec: elapsedTime,
                    desc: `วิ่งระยะทาง ${distance.toFixed(2)} กม. ใช้เวลา ${Math.floor(elapsedTime/60)} นาที`
                });
            };

            const handleUpload1 = async (e) => {
                if (!e.target.files[0]) return;
                const base64 = await compressImage(e.target.files[0]);
                setImgBefore(base64);
                setTimeBefore(Date.now());
                notify('บันทึกรูปก่อนเริ่มแล้ว! ไปออกกำลังกายได้เลย!', 'success');
            };

            const handleUpload2 = async (e) => {
                if (!e.target.files[0]) return;
                const base64 = await compressImage(e.target.files[0]);
                setImgAfter(base64);
                const now = Date.now();
                setTimeAfter(now);
                
                // คำนวณเป็นนาที
                if (timeBefore) {
                    const diffMins = Math.floor((now - timeBefore) / (1000 * 60));
                    setTimeDiffMinutes(diffMins);
                }
            };

            const submitPhotoTask = () => {
                // กันเด็กถ่ายรูปรัวๆ ไม่ถึง 1 นาที
                if (timeDiffMinutes < 1) return notify('คุณเพิ่งเริ่มไปแปบเดียวเอง! (ต้องทำกิจกรรมอย่างน้อย 1 นาที)', 'error');

                submitTask({
                    type: 'photo2', img1: imgBefore, img2: imgAfter, durationMins: timeDiffMinutes,
                    desc: `ใช้เวลาทำกิจกรรมรวม ${timeDiffMinutes} นาที`
                });
            };

            const submitTask = async (extraData) => {
                setIsLoading(true);
                try {
                    await db.collection(TASKS_PATH).add({
                        studentName,
                        activityTitle: selectedAct.title,
                        points: selectedAct.points,
                        status: 'pending',
                        timeStr: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
                        createdAt: Date.now(),
                        ...extraData
                    });
                    notify('ส่งข้อมูลสำเร็จ! รอคุณครูตรวจครับ 🎉');
                    resetActivity();
                    setActiveTab('home');
                } catch (error) { notify('เกิดข้อผิดพลาด กรุณาลองใหม่', 'error'); }
                setIsLoading(false);
            };

            const resetActivity = () => {
                setSelectedAct(null); setIsTracking(false); setDistance(0); setElapsedTime(0);
                setImgBefore(null); setImgAfter(null); setTimeBefore(null); setTimeAfter(null); setTimeDiffMinutes(0);
            };

            const actionTask = async (id, status) => {
                await db.collection(TASKS_PATH).doc(id).update({ status });
                notify(status === 'approved' ? 'อนุมัติงานแล้ว' : 'ปฏิเสธงานแล้ว');
            };

            const myApproved = allTasks.filter(t => t.studentName === studentName && t.status === 'approved');
            const myPoints = myApproved.reduce((sum, t) => sum + t.points, 0);
            const pendingTasks = allTasks.filter(t => t.status === 'pending');

            const stats = allTasks.filter(t => t.status === 'approved').reduce((acc, t) => {
                if (!acc[t.studentName]) acc[t.studentName] = { name: t.studentName, pts: 0 };
                acc[t.studentName].pts += t.points;
                return acc;
            }, {});
            const leaderboard = Object.values(stats).sort((a, b) => b.pts - a.pts).slice(0, 10);

            // หน้า Login (ธีมเขียวมิ้นต์)
            if (!isLoggedIn) return (
                <div className="min-h-screen flex items-center justify-center p-5 bg-gradient-to-br from-emerald-100 to-green-50">
                    <div className="w-full max-w-sm bg-white rounded-[2rem] shadow-xl p-8 text-center relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-2 bg-emerald-400"></div>
                        
                        <div className="w-24 h-24 rounded-full flex flex-col items-center justify-center mx-auto mb-4 bg-emerald-400 text-white shadow-lg shadow-emerald-200">
                            <i className="fa-solid fa-heart-pulse text-4xl"></i>
                        </div>
                        <h1 className="text-3xl font-black text-slate-800 tracking-tight">HEALTH</h1>
                        <p className="text-emerald-500 font-bold tracking-widest text-sm mb-8">PASSPORT</p>
                        
                        <div className="space-y-4">
                            <div className="bg-gray-50 p-4 rounded-2xl border border-gray-100">
                                <label className="text-xs font-bold text-gray-500 mb-2 block text-left">ชื่อนักเรียน (สะสมแต้ม)</label>
                                <input type="text" placeholder="ชื่อ - นามสกุล" value={inputName} onChange={e=>setInputName(e.target.value)} className="w-full p-3 rounded-xl border border-gray-200 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none font-medium mb-3"/>
                                <button onClick={()=>handleLogin('student')} className="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl shadow-md shadow-emerald-200 active:scale-95 transition">เข้าสู่ระบบนักเรียน</button>
                            </div>
                            
                            <div className="flex gap-2">
                                <input type="password" placeholder="รหัสครู..." value={teacherPassword} onChange={e=>setTeacherPassword(e.target.value)} className="w-2/3 p-3 rounded-xl border border-gray-200 outline-none text-sm"/>
                                <button onClick={()=>handleLogin('teacher')} className="w-1/3 bg-slate-800 text-white font-bold rounded-xl text-sm active:scale-95 transition">เข้าตรวจ</button>
                            </div>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-20 relative max-w-md mx-auto bg-slate-50 sm:shadow-2xl sm:min-h-[850px] overflow-hidden">
                    
                    {/* Header โค้งสีเขียว */}
                    <div className="bg-gradient-to-br from-emerald-400 to-emerald-600 pt-12 pb-8 px-6 rounded-b-[2.5rem] text-white shadow-lg relative z-20">
                        <button onClick={()=>setIsLoggedIn(false)} className="absolute top-5 right-5 text-white/70 hover:text-white bg-white/10 p-2 rounded-full backdrop-blur-sm"><i className="fa-solid fa-power-off"></i></button>
                        
                        <div className="flex items-center gap-4">
                            <div className="w-14 h-14 rounded-full border-2 border-white/30 bg-white/20 flex items-center justify-center text-xl backdrop-blur-sm shadow-inner">
                                <i className={`fa-solid ${role==='student'?'fa-user':'fa-shield-halved'}`}></i>
                            </div>
                            <div>
                                <p className="text-emerald-100 font-medium text-xs mb-0.5">{role==='student'?'นักเรียน':'โหมดครูผู้ตรวจ'}</p>
                                <h2 className="text-xl font-bold truncate max-w-[220px]">{role==='student'?studentName:'คุณครู'}</h2>
                            </div>
                        </div>

                        {role === 'student' && activeTab === 'home' && (
                            <div className="mt-6 bg-white/10 backdrop-blur-md rounded-2xl p-4 border border-white/20 flex justify-between items-center shadow-sm">
                                <div>
                                    <p className="text-emerald-100 text-xs font-bold mb-1">คะแนนสะสมของคุณ</p>
                                    <div className="flex items-baseline gap-1">
                                        <span className="text-4xl font-black">{myPoints}</span>
                                        <span className="text-sm font-medium opacity-80">แต้ม</span>
                                    </div>
                                </div>
                                <div className="text-right">
                                    <i className="fa-solid fa-medal text-4xl text-yellow-300 drop-shadow-md"></i>
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="px-5 pt-6 pb-24 h-[calc(100vh-180px)] sm:h-[650px] overflow-y-auto bg-slate-50 relative z-10 -mt-5">
                        
                        {/* หน้านักเรียน: เลือก 4 ฐาน */}
                        {role === 'student' && activeTab === 'home' && (
                            <div className="animate-in fade-in">
                                <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2">
                                    <i className="fa-solid fa-fire text-orange-500"></i> เลือกกิจกรรมสุขภาพ
                                </h3>
                                <div className="grid grid-cols-2 gap-4">
                                    {ACTIVITIES.map(act => (
                                        <div key={act.id} onClick={() => { setSelectedAct(act); setActiveTab('activity'); }} 
                                             className="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 cursor-pointer active:scale-95 transition-transform flex flex-col items-center text-center">
                                            <div className={`w-14 h-14 rounded-2xl flex items-center justify-center text-2xl mb-3 shadow-sm ${act.color}`}>
                                                <i className={`fa-solid ${act.icon}`}></i>
                                            </div>
                                            <h4 className="font-bold text-slate-800 text-sm leading-tight h-10 flex items-center">{act.title}</h4>
                                            <span className="text-[10px] font-bold px-3 py-1 rounded-full bg-emerald-50 text-emerald-600 mt-1 border border-emerald-100">+{act.points} แต้ม</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* หน้ากิจกรรม (วิ่ง / ถ่ายรูป) */}
                        {role === 'student' && activeTab === 'activity' && selectedAct && (
                            <div className="animate-in slide-in-from-right-4">
                                <button onClick={resetActivity} className="text-sm font-bold text-slate-500 mb-4 bg-white px-4 py-2 rounded-full shadow-sm hover:bg-slate-100"><i className="fa-solid fa-arrow-left mr-1"></i> ย้อนกลับ</button>
                                
                                <div className="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-100 text-center relative">
                                    
                                    <div className={`w-16 h-16 mx-auto rounded-2xl flex items-center justify-center text-3xl mb-4 shadow-sm ${selectedAct.color}`}>
                                        <i className={`fa-solid ${selectedAct.icon}`}></i>
                                    </div>
                                    <h2 className="text-xl font-black text-slate-800 mb-1">{selectedAct.title}</h2>
                                    <p className="text-emerald-500 font-bold text-sm mb-6 bg-emerald-50 inline-block px-3 py-1 rounded-full border border-emerald-100">รางวัล +{selectedAct.points} แต้ม</p>

                                    {/* 1. ระบบจับวิ่ง (GPS) */}
                                    {selectedAct.type === 'gps' && (
                                        <div className="flex flex-col items-center">
                                            <div className={`w-48 h-48 rounded-full border-[10px] flex flex-col items-center justify-center mb-6 transition-all ${isTracking ? 'border-emerald-400 pulse-ring bg-emerald-50' : 'border-slate-100 bg-white'}`}>
                                                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wide">ระยะทาง (กม.)</span>
                                                <span className={`text-5xl font-black tracking-tighter ${isTracking?'text-emerald-600':'text-slate-800'}`}>{distance.toFixed(2)}</span>
                                                <span className="text-sm font-mono text-slate-500 mt-1 bg-slate-100 px-3 py-0.5 rounded-full">{formatTime(elapsedTime)}</span>
                                            </div>
                                            
                                            {!isTracking ? (
                                                <button onClick={startRunning} className="w-full bg-emerald-500 text-white font-bold text-lg py-4 rounded-2xl active:scale-95 shadow-md shadow-emerald-200"><i className="fa-solid fa-play mr-2"></i> เริ่มวิ่ง!</button>
                                            ) : (
                                                <button onClick={stopRunning} disabled={isLoading} className="w-full bg-red-500 text-white font-bold text-lg py-4 rounded-2xl active:scale-95 shadow-md shadow-red-200"><i className="fa-solid fa-stop mr-2"></i> จบการวิ่ง และส่งผล</button>
                                            )}
                                        </div>
                                    )}

                                    {/* 2. ระบบถ่ายรูป Before & After */}
                                    {selectedAct.type === 'photo2' && (
                                        <div className="space-y-4 text-left">
                                            <input type="file" accept="image/*" capture="environment" className="hidden" ref={fileInputRef1} onChange={handleUpload1} />
                                            <input type="file" accept="image/*" capture="environment" className="hidden" ref={fileInputRef2} onChange={handleUpload2} />
                                            
                                            {/* ช่อง 1 */}
                                            <div onClick={()=> !imgBefore && fileInputRef1.current.click()} 
                                                 className={`upload-box relative border-2 border-dashed rounded-2xl p-4 flex items-center gap-4 overflow-hidden h-28
                                                 ${imgBefore ? 'completed border-emerald-400' : 'active border-emerald-400 bg-emerald-50'}`}>
                                                
                                                <div className={`w-12 h-12 rounded-full flex items-center justify-center text-xl font-black shrink-0 z-10 ${imgBefore?'bg-emerald-500 text-white shadow-md':'bg-emerald-100 text-emerald-500'}`}>1</div>
                                                
                                                <div className="z-10 flex-1">
                                                    <p className={`font-bold ${imgBefore?'text-emerald-700':'text-emerald-600'}`}>{imgBefore?'ถ่ายรูปก่อนเริ่มสำเร็จ!':'ถ่ายรูป "ก่อน" ออกกำลังกาย'}</p>
                                                    {imgBefore && <p className="text-xs text-emerald-500 font-mono mt-0.5"><i className="fa-solid fa-clock"></i> {new Date(timeBefore).toLocaleTimeString('th-TH')}</p>}
                                                </div>

                                                {imgBefore && <img src={imgBefore} className="absolute inset-0 w-full h-full object-cover opacity-20"/>}
                                            </div>

                                            {/* ช่อง 2 */}
                                            <div onClick={()=> imgBefore && !imgAfter && fileInputRef2.current.click()} 
                                                 className={`upload-box relative border-2 border-dashed rounded-2xl p-4 flex items-center gap-4 overflow-hidden h-28
                                                 ${!imgBefore ? 'disabled' : imgAfter ? 'completed border-emerald-400' : 'active border-orange-400 bg-orange-50'}`}>
                                                
                                                <div className={`w-12 h-12 rounded-full flex items-center justify-center text-xl font-black shrink-0 z-10 ${!imgBefore?'bg-slate-200 text-slate-400':imgAfter?'bg-emerald-500 text-white shadow-md':'bg-orange-100 text-orange-500'}`}>2</div>
                                                
                                                <div className="z-10 flex-1">
                                                    <p className={`font-bold ${!imgBefore?'text-slate-400':imgAfter?'text-emerald-700':'text-orange-600'}`}>{!imgBefore?'ต้องถ่ายรูปที่ 1 ก่อน':imgAfter?'ถ่ายรูปหลังเสร็จสำเร็จ!':'ออกกำลังกายเสร็จแล้ว! ถ่ายรูปเลย'}</p>
                                                    {imgAfter && <p className="text-xs text-emerald-500 font-mono mt-0.5"><i className="fa-solid fa-clock"></i> {new Date(timeAfter).toLocaleTimeString('th-TH')}</p>}
                                                </div>

                                                {imgAfter && <img src={imgAfter} className="absolute inset-0 w-full h-full object-cover opacity-20"/>}
                                            </div>
                                            
                                            {/* สรุปเวลา & ปุ่มส่ง */}
                                            {imgBefore && imgAfter && (
                                                 <div className="animate-in slide-in-from-bottom-4 mt-6">
                                                     <div className="bg-emerald-50 py-4 rounded-2xl border border-emerald-100 text-center mb-4">
                                                         <p className="text-xs font-bold text-emerald-600 mb-1">สรุปเวลาที่คุณออกกำลังกาย</p>
                                                         <p className="text-3xl font-black text-emerald-500">{timeDiffMinutes} <span className="text-sm font-medium text-emerald-600">นาที</span></p>
                                                     </div>
                                                     <button onClick={submitPhotoTask} disabled={isLoading} className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition">
                                                         {isLoading ? 'กำลังส่งข้อมูล...' : <><i className="fa-solid fa-paper-plane mr-2"></i> ส่งให้คุณครูตรวจ</>}
                                                     </button>
                                                 </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* หน้า Leaderboard */}
                        {activeTab === 'leaderboard' && (
                            <div className="animate-in fade-in">
                                <h2 className="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2"><i className="fa-solid fa-trophy text-yellow-500"></i> อันดับคนเก่ง (Top 10)</h2>
                                {leaderboard.length === 0 ? (
                                    <div className="text-center text-slate-400 bg-white p-8 rounded-3xl border border-slate-100">ยังไม่มีข้อมูล</div>
                                ) : (
                                    <div className="space-y-3">
                                        {leaderboard.map((u, i) => (
                                            <div key={u.name} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm ${i===0?'bg-yellow-100 text-yellow-600':i===1?'bg-slate-200 text-slate-600':i===2?'bg-orange-100 text-orange-600':'bg-slate-50 text-slate-400'}`}>{i+1}</div>
                                                    <span className="font-bold text-slate-700">{u.name}</span>
                                                </div>
                                                <span className="font-black text-emerald-500 text-lg">{u.pts} <span className="text-xs text-emerald-300">แต้ม</span></span>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* หน้าครู: ตรวจงาน */}
                        {role === 'teacher' && activeTab === 'review' && (
                            <div className="animate-in fade-in">
                                {pendingTasks.length === 0 ? (
                                    <div className="text-center bg-white p-10 rounded-3xl border border-dashed border-slate-200 text-slate-400">
                                        <i className="fa-solid fa-mug-hot text-4xl mb-3 text-emerald-200"></i><p className="font-bold">ตรวจงานหมดแล้ว!</p>
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        {pendingTasks.map(t => (
                                            <div key={t.id} className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200">
                                                <div className="flex justify-between items-start mb-4">
                                                    <div>
                                                        <h4 className="font-bold text-slate-800 text-lg">{t.studentName}</h4>
                                                        <p className="text-xs text-slate-500"><i className="fa-regular fa-clock"></i> ส่งเมื่อ {t.timeStr}</p>
                                                    </div>
                                                    <span className="bg-emerald-50 text-emerald-600 border border-emerald-100 text-xs font-bold px-3 py-1 rounded-full">{t.activityTitle}</span>
                                                </div>

                                                {t.type === 'gps' ? (
                                                    <div className="bg-slate-50 rounded-2xl p-4 text-center border border-slate-100 mb-4">
                                                        <i className="fa-solid fa-route text-3xl text-emerald-300 mb-2"></i>
                                                        <p className="font-bold text-slate-700">{t.desc}</p>
                                                    </div>
                                                ) : (
                                                    <div>
                                                        <div className="flex gap-2 mb-3">
                                                            <div className="flex-1 relative rounded-xl overflow-hidden aspect-square bg-slate-100 border border-slate-200">
                                                                <img src={t.img1} className="w-full h-full object-cover" />
                                                                <div className="absolute top-1 left-1 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded-md">1. ก่อนเริ่ม</div>
                                                            </div>
                                                            <div className="flex-1 relative rounded-xl overflow-hidden aspect-square bg-slate-100 border border-slate-200">
                                                                <img src={t.img2} className="w-full h-full object-cover" />
                                                                <div className="absolute top-1 left-1 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded-md">2. หลังเสร็จ</div>
                                                            </div>
                                                        </div>
                                                        <div className="text-center text-sm font-bold text-emerald-600 bg-emerald-50 py-2 rounded-xl mb-4 border border-emerald-100">
                                                            <i className="fa-solid fa-stopwatch"></i> {t.desc}
                                                        </div>
                                                    </div>
                                                )}

                                                <div className="flex gap-2">
                                                    <button onClick={()=>actionTask(t.id, 'rejected')} className="flex-1 py-3 text-red-500 font-bold bg-red-50 hover:bg-red-100 rounded-xl transition text-sm"><i className="fa-solid fa-xmark"></i> ปฏิเสธ</button>
                                                    <button onClick={()=>actionTask(t.id, 'approved')} className="flex-[2] py-3 text-white font-bold bg-emerald-500 hover:bg-emerald-600 rounded-xl shadow-md transition text-sm"><i className="fa-solid fa-check"></i> อนุมัติ +{t.points}</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {/* Navbar ด้านล่าง */}
                    <div className="absolute bottom-0 w-full bg-white/90 backdrop-blur-md border-t border-slate-100 px-6 py-4 flex justify-around items-center z-30 pb-safe">
                        {role === 'student' ? (
                            <>
                                <button onClick={() => { setActiveTab('home'); resetActivity(); }} className={`flex flex-col items-center gap-1 ${activeTab==='home'||activeTab==='activity' ? 'text-emerald-600' : 'text-slate-400 hover:text-slate-600'}`}>
                                    <i className="fa-solid fa-house text-xl"></i><span className="text-[10px] font-bold">หน้าแรก</span>
                                </button>
                                <button onClick={() => setActiveTab('leaderboard')} className={`flex flex-col items-center gap-1 ${activeTab==='leaderboard' ? 'text-emerald-600' : 'text-slate-400 hover:text-slate-600'}`}>
                                    <i className="fa-solid fa-chart-simple text-xl"></i><span className="text-[10px] font-bold">อันดับคะแนน</span>
                                </button>
                            </>
                        ) : (
                            <>
                                <button onClick={() => setActiveTab('review')} className={`flex flex-col items-center gap-1 ${activeTab==='review' ? 'text-emerald-600' : 'text-slate-400 hover:text-slate-600'}`}>
                                    <i className="fa-solid fa-clipboard-check text-xl"></i><span className="text-[10px] font-bold">ตรวจงาน ({pendingTasks.length})</span>
                                </button>
                                <button onClick={() => setActiveTab('leaderboard')} className={`flex flex-col items-center gap-1 ${activeTab==='leaderboard' ? 'text-emerald-600' : 'text-slate-400 hover:text-slate-600'}`}>
                                    <i className="fa-solid fa-chart-simple text-xl"></i><span className="text-[10px] font-bold">อันดับคะแนน</span>
                                </button>
                            </>
                        )}
                    </div>

                    {/* แจ้งเตือน Toast */}
                    {showNotif.show && (
                        <div className="absolute top-8 left-1/2 -translate-x-1/2 z-50 animate-in slide-in-from-top-4">
                            <div className={`${showNotif.type==='error'?'bg-red-500':'bg-slate-800'} text-white px-5 py-3 rounded-full shadow-2xl text-sm font-bold flex items-center gap-2 w-max`}>
                                <i className={`fa-solid ${showNotif.type==='error'?'fa-circle-xmark':'fa-circle-check'}`}></i> {showNotif.msg}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
