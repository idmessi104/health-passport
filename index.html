/* ============================================================
   2) HELPERS
============================================================ */
function getDistanceM(lat1,lon1,lat2,lon2){
  const R=6371000, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
const fmtTime = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
const fmtDT = ts => ts ? new Date(ts).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '-';
const greet = () => { const h=new Date().getHours(); return h<12?'สวัสดีตอนเช้า':h<17?'สวัสดีตอนบ่าย':'สวัสดีตอนเย็น'; };
const initial = n => (n||'?').trim().charAt(0);
const getStartOfWeek = (dStr) => { const d = dStr ? new Date(dStr) : new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d; };
const shortGrade = g => g==='มัธยมศึกษาปีที่ 1'?'ม.1':g==='มัธยมศึกษาปีที่ 2'?'ม.2':g==='มัธยมศึกษาปีที่ 3'?'ม.3':g;

function compressImage(file, maxSize=560, quality=.72){
  return new Promise((res,rej)=>{
    if(!file || !file.type.startsWith('image/')) return rej(new Error('ไฟล์ไม่ใช่รูปภาพ'));
    const r=new FileReader();
    r.onload=e=>{ const img=new Image();
      img.onload=()=>{ let {width:w,height:h}=img;
        if(w>h&&w>maxSize){h=h*maxSize/w;w=maxSize} else if(h>maxSize){w=w*maxSize/h;h=maxSize}
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',quality));
      };
      img.onerror=()=>rej(new Error('อ่านรูปไม่สำเร็จ')); img.src=e.target.result; };
    r.onerror=()=>rej(new Error('อ่านไฟล์ไม่สำเร็จ')); r.readAsDataURL(file);
  });
}

function calcStats(approvedTasks) {
    const hpByDay = {}; const hpByType = {};
    approvedTasks.forEach(t=>{
       const dateStr = new Date(t.createdAt).toLocaleDateString('en-CA');
       if(!hpByDay[dateStr]) hpByDay[dateStr] = [];
       hpByDay[dateStr].push(t.hp||0);
       
       if(!hpByType[t.activityId]) hpByType[t.activityId] = 0;
       hpByType[t.activityId] += (t.hp||0);
    });
    
    const hpByWeek = {};
    let totalAcc = 0, totalGrading = 0, activeWeeks = 0;
    
    Object.entries(hpByDay).forEach(([dStr, hps])=>{
       const cappedDay = Math.min(100, hps.reduce((a,b)=>a+b,0)); 
       const wKey = getStartOfWeek(dStr).toLocaleDateString('en-CA');
       if(!hpByWeek[wKey]) hpByWeek[wKey] = 0;
       hpByWeek[wKey] += cappedDay;
    });
    
    Object.values(hpByWeek).forEach(wHP => {
       totalAcc += wHP; 
       const gHP = Math.min(600, wHP); 
       totalGrading += gHP;
       if(gHP >= 100) activeWeeks++; 
    });
    
    const variety = Object.values(hpByType).filter(h=>h>=100).length;
    const scoreA = Math.min(7, totalGrading / 100);
    const scoreB = activeWeeks>=4 ? 2.0 : activeWeeks===3 ? 1.5 : activeWeeks===2 ? 1.0 : activeWeeks===1 ? 0.5 : 0;
    const scoreC = variety>=4 ? 1.0 : variety===3 ? 0.7 : variety===2 ? 0.4 : 0;
    const totalScore = (scoreA+scoreB+scoreC).toFixed(1);
    
    return { totalAcc, totalGrading, activeWeeks, variety, scoreA, scoreB, scoreC, totalScore, hpByWeek, hpByDay };
}

  // [อัปเดต]: ฟังก์ชันจัดการสัญญาณ GPS ที่ปรับจูนใหม่ให้จับระยะง่ายขึ้น
  const onPosition=useCallback(pos=>{
    const {latitude:lat,longitude:lng,accuracy:acc,speed:devSpeed}=pos.coords; const t=pos.timestamp||Date.now();
    setGpsAcc(Math.round(acc));
    
    if(warmup.current<GPS.warmupFixes){ 
        warmup.current++; lastPos.current={lat,lng,t,acc}; setGpsState('warmup'); return; 
    }
    if(acc>GPS.maxAccuracy){ 
        setGpsState('weak'); streak.current=0; return; 
    }
    
    const prev=lastPos.current; 
    if(!prev){ lastPos.current={lat,lng,t,acc}; return; }
    
    const dt=(t-prev.t)/1000; 
    if(dt<1) return;
    
    const d=getDistanceM(prev.lat,prev.lng,lat,lng);
    
    // คำนวณ Floor (เกณฑ์ขยับขั้นต่ำ) โดยใช้ NoiseFactor ที่ลดลง
    const floor=Math.max(GPS.minMove,((acc+prev.acc)/2)*GPS.noiseFactor);
    
    if(d<floor){ 
        setGpsState('idle'); streak.current=0; pending.current=0; return; 
    }
    
    const v=d/dt;
    if(v>GPS.maxSpeed){ 
        lastPos.current={lat,lng,t,acc}; streak.current=0; pending.current=0; setGpsState('idle'); return; 
    }
    if(v<GPS.minSpeed){ 
        setGpsState('idle'); streak.current=0; pending.current=0; return; 
    }
    if(typeof devSpeed==='number'&&devSpeed>=0&&devSpeed<GPS.minSpeed){ 
        setGpsState('idle'); streak.current=0; pending.current=0; return; 
    }
    
    lastPos.current={lat,lng,t,acc}; streak.current++;
    
    if(streak.current<GPS.moveStreak){ 
        pending.current+=d; setGpsState('idle'); return; 
    }
    
    const add=d+pending.current; pending.current=0;
    setDistance(x=>x+add/1000); 
    movingAt.current=Date.now(); 
    setGpsState('moving');
  },[]);

  const startRunning=()=>{
    if(!navigator.geolocation) return showToast('อุปกรณ์ไม่รองรับ GPS','error');
    setDistance(0); setElapsedTime(0); setMovingTime(0); setGpsState('warmup');
    lastPos.current=null; warmup.current=0; streak.current=0; pending.current=0; movingAt.current=0; setIsTracking(true);
    timerRef.current=setInterval(()=>{ setElapsedTime(t=>t+1); if(Date.now()-movingAt.current<6000) setMovingTime(t=>t+1); },1000);
    // อัปเดต options ของ GPS ให้ดึงข้อมูลบ่อยขึ้นและใช้พลังงานสูงสุด
    watchRef.current=navigator.geolocation.watchPosition(onPosition,err=>showToast('GPS: '+err.message,'error'),{enableHighAccuracy:true,maximumAge:0,timeout:10000});
    showToast('กำลังจับสัญญาณ GPS...');
  };

      else {

      }

    finally{ setBusy(false); e.target.value=''; }

    if(!selectedAct||!user) return;
    const a=selectedAct;
    
    const lastT = myTasks[0];
    if(lastT && lastT.createdAt) {
      const hrs = (Date.now() - lastT.createdAt) / 3600000;
      if(hrs < 2) return showToast(`ต้องเว้นระยะ 2 ชั่วโมง (รออีก ${Math.ceil((2-hrs)*60)} นาที)`,'error');
    }

    let hp = 0;
    if(a.type==='gps'){
      if(isTracking) return showToast('กรุณากดหยุดจับเวลาก่อนส่ง','error');
      if(distance<a.minKm) return showToast(`ระยะยังไม่ถึง ${a.minKm} กม.`,'error');
      const dist = Number(distance.toFixed(2));
      const mins = elapsedTime / 60;
      const pace = dist > 0 ? mins / dist : 0;
      let runRate = 0.25; 
      if (pace < 3) runRate = 0; 
      else if (pace <= 4.8) runRate = 0.75; 
      else if (pace <= 6.32) runRate = 0.65; 
      else if (pace <= 7.5) runRate = 0.55;  
      else if (pace <= 10.92) runRate = 0.40; 
      hp = runRate * mins;
    }else{
      if(!imgBefore||!imgAfter) return showToast('ต้องมีรูปครบทั้ง 2 ใบ','error');
      if(timeDiffMinutes<a.minMin) return showToast(`เวลายังไม่ถึง ${a.minMin} นาที`,'error');
      const effectiveMins = Math.min(240, timeDiffMinutes); 
      hp = a.rate * effectiveMins;
    }

    hp = Math.min(100, Math.round(hp)); 
    if(hp <= 0) return showToast('กิจกรรมนี้ไม่ผ่านเกณฑ์การคำนวณ HP (เช่น วิ่งเร็วกว่า 3 นาที/กม.)','error');

    setBusy(true);
    try{
      await db.collection(TASKS_PATH).add({
        studentName:user.name, studentNo:user.studentNo, grade:user.grade,
        activityId:a.id, activityName:a.name, hp:hp, status:'pending',
        distance:a.type==='gps'?Number(distance.toFixed(2)):null, duration:a.type==='gps'?elapsedTime:timeDiffMinutes*60,
        movingTime:a.type==='gps'?movingTime:null, avgPace:a.type==='gps'&&distance>0?Number((elapsedTime/60/distance).toFixed(2)):null,
        imgBefore:imgBefore||null, imgAfter:imgAfter||null, timeBefore:timeBefore||null, timeAfter:timeAfter||null,
        createdAt:Date.now(), serverAt:firebase.firestore.FieldValue.serverTimestamp(),
      });
      showToast('ส่งให้ครูตรวจเรียบร้อย!'); 
      if (selectedAct && user) localStorage.removeItem(`hp_draft_${user.name}_${selectedAct.id}`); 
      resetActivity();
    }catch(err){ showToast('บันทึกไม่สำเร็จ','error'); }
    finally{ setBusy(false); }
  };

                )}
                <button onClick={isTracking?stopRunning:startRunning} className={`w-full h-14 mt-4 rounded-2xl font-bold text-white shadow-lift press ${isTracking?'bg-rose-500':'bg-brand-600'}`}>
                  <i className={`fas ${isTracking?'fa-stop':'fa-play'} mr-2 text-sm`}></i>{isTracking?'หยุดจับเวลา':'เริ่มวิ่ง'}
                </button>
              </div>
            ) : (
              <div className="bg-white rounded-3xl shadow-card p-5">
                <div className="grid grid-cols-2 gap-3">
                  <PhotoSlot label="ก่อนเริ่ม" step="1" img={imgBefore} time={timeBefore} onPick={e=>handleUpload(e,1)} onView={setPreview} onDelete={deleteBeforePhoto} disabled={busy}/>
                  <PhotoSlot label="หลังเสร็จ" step="2" img={imgAfter} time={timeAfter} onPick={e=>handleUpload(e,2)} onView={setPreview} disabled={busy||!imgBefore} hint={!imgBefore?'ถ่ายรูปแรกก่อน':null}/>
                </div>
                <div className="mt-4">
                  <div className="flex justify-between text-xs mb-2">
                    <span className="text-ink-500 font-medium"><i className="fas fa-stopwatch mr-1.5"></i>ระยะเวลา</span>
                    <span className={`font-bold ${timeDiffMinutes>=selectedAct.minMin?'text-brand-600':'text-amber-600'}`}>{timeDiffMinutes} / {selectedAct.minMin} นาที</span>
                  </div>
                  <div className="h-2.5 bg-paper rounded-full overflow-hidden">
                    <div className={`h-full rounded-full transition-all duration-500 ${timeDiffMinutes>=selectedAct.minMin?'bg-brand-500':'bg-amber-400'}`} style={{width:`${Math.min(100,(timeDiffMinutes/selectedAct.minMin)*100)}%`}}></div>
                  </div>
                </div>
              </div>
            )}
            <button onClick={submitTask} disabled={busy} className="w-full h-14 rounded-2xl bg-brand-600 text-white font-bold shadow-lift press disabled:opacity-50">
              {busy?<><i className="fas fa-spinner fa-spin mr-2"></i>กำลังส่ง...</>:<><i className="fas fa-paper-plane mr-2 text-sm"></i>ส่งให้ครูตรวจ</>}
            </button>
          </div>
        )}

        {/* ================= LEADERBOARD ================= */}
        {activeTab==='leaderboard' && (
          <div className="fade-up bg-white rounded-3xl shadow-card p-4">
            <SectionTitle icon="fa-trophy" color="text-amber-500" title="อันดับ HP สะสม" sub="Top 10 ของโรงเรียน" flush/>
            {loadingData ? <SkeletonList/> : leaderboard.length===0 ? <EmptyInline text="ยังไม่มีข้อมูล"/> : (
              <div className="space-y-1.5 mt-3">
                {leaderboard.map((r,i)=>{
                  const me=r.name===user.name; const medal=['bg-amber-400','bg-slate-300','bg-orange-400'][i]||'bg-slate-200';
                  return (
                    <div key={r.name} className={`flex items-center gap-3 p-3 rounded-2xl transition ${me?'bg-brand-50 ring-1 ring-brand-200':'bg-paper'}`}>
                      <span className={`w-9 h-9 rounded-xl ${medal} ${i<3?'text-white':'text-ink-700'} flex items-center justify-center font-bold text-sm flex-shrink-0`}>{i<3?<i className="fas fa-crown text-xs"></i>:i+1}</span>
                      <div className="flex-1 min-w-0">
                        <p className="font-semibold text-ink-900 text-sm truncate">{r.name}{me && <span className="text-[10px] text-brand-600 font-bold ml-1.5">คุณ</span>}</p>
                        <p className="text-[11px] text-ink-400">{shortGrade(r.grade)} เลขที่ {r.studentNo}</p>
                      </div>
                      <div className="text-right flex-shrink-0">
                        <span className="font-bold text-brand-600 num">{r.points}</span>
                        <p className="text-[9px] text-ink-400">HP</p>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {/* ================= HISTORY ================= */}
        {activeTab==='history' && (
          <div className="fade-up bg-white rounded-3xl shadow-card p-4">
            <SectionTitle icon="fa-clock-rotate-left" color="text-sky-500" title="ประวัติของฉัน" sub={`ทั้งหมด ${myTasks.length} รายการ`} flush/>
            {loadingData ? <SkeletonList/> : myTasks.length===0 ? <EmptyInline text="ยังไม่มีรายการ"/> : (
              <div className="mt-2">{myTasks.map(t=><TaskRow key={t.id} t={t}/>)}</div>
            )}
          </div>
        )}

        {/* ================= TEACHER SCORES ================= */}
        {!isStudent && activeTab==='scores' && (
           <div className="fade-up space-y-3">
             <div className="bg-white rounded-3xl shadow-card p-4">
                <SectionTitle icon="fa-ranking-star" color="text-brand-500" title="สรุปคะแนนนักเรียน" sub="คำนวณอัตโนมัติจากงานที่อนุมัติแล้ว" flush/>
                <div className="flex gap-2 mt-4 overflow-x-auto pb-1 -mx-1 px-1">
                   {['มัธยมศึกษาปีที่ 1', 'มัธยมศึกษาปีที่ 2', 'มัธยมศึกษาปีที่ 3'].map(g => (
                      <button key={g} onClick={()=>setTeacherFilterGrade(g)} 
                        className={`whitespace-nowrap px-4 py-2 rounded-xl text-xs font-bold transition-all ${teacherFilterGrade===g?'bg-brand-600 text-white shadow-md':'bg-paper text-ink-500'}`}>
                        ชั้น {shortGrade(g)}
                      </button>
                   ))}
                </div>
             </div>
             
             <div className="space-y-2">
                {loadingData ? <SkeletonList/> : filteredTeacherUsers.length===0 ? <EmptyCard icon="fa-users-slash" text={`ไม่มีนักเรียนชั้น ${shortGrade(teacherFilterGrade)}`}/> : 
                  filteredTeacherUsers.map(u => {
                    const uTasks = tasks.filter(t => t.studentName === u.name && t.status === 'approved');
                    const uStats = calcStats(uTasks);
                    return (
                      <div key={u.id} className="bg-white rounded-3xl shadow-card p-3 flex items-center justify-between gap-3 fade-up">
                         <div className="w-12 h-12 bg-brand-50 rounded-2xl text-brand-600 font-bold text-lg flex items-center justify-center flex-shrink-0">
                            {u.studentNo}
                         </div>
                         <div className="flex-1 min-w-0">
                            <p className="font-bold text-ink-900 truncate text-[15px]">{u.name}</p>
                            <p className="text-[11px] text-ink-400 mt-0.5">อนุมัติแล้ว {uTasks.length} งาน</p>
                         </div>
                         <div className="text-right flex-shrink-0">
                            <p className="font-bold text-brand-600 text-[17px] num">{uStats.totalScore}</p>
                            <p className="text-[10px] text-ink-400">เต็ม 10</p>
                         </div>
                         <button onClick={()=>deleteStudent(u.name)} className="w-10 h-10 rounded-full bg-rose-50 text-rose-500 flex items-center justify-center press flex-shrink-0 ml-1">
                            <i className="fas fa-trash-alt text-sm"></i>
                         </button>
                      </div>
                    );
                  })
                }
             </div>
           </div>
        )}

        {/* ================= TEACHER REVIEW ================= */}
        {!isStudent && activeTab==='review' && (
          <div className="fade-up space-y-3">
            <div className="bg-white rounded-3xl shadow-card p-4 flex items-center gap-3">
              <div className="w-12 h-12 rounded-2xl bg-brand-50 flex items-center justify-center"><i className="fas fa-clipboard-check text-lg text-brand-600"></i></div>
              <div className="flex-1"><p className="font-bold text-ink-900">รายการรอตรวจสอบ</p><p className="text-[11px] text-ink-400">แตะรูปเพื่อดูขนาดเต็ม</p></div>
              <span className="bg-amber-50 text-amber-600 px-3.5 py-1.5 rounded-full text-sm font-bold num">{pendingAll.length}</span>
            </div>
            {loadingData ? <SkeletonList/> : pendingAll.length===0 ? ( <EmptyCard icon="fa-circle-check" tone="text-brand-400" text="ตรวจครบทุกรายการแล้ว 🎉"/>
            ) : pendingAll.map(t=>{
              const a=actById(t.activityId);
              return (
                <div key={t.id} className="bg-white rounded-3xl shadow-card p-4 fade-up">
                  <div className="flex items-center gap-3">
                    <div className="w-11 h-11 rounded-2xl bg-brand-50 text-brand-600 flex items-center justify-center font-bold flex-shrink-0">{initial(t.studentName)}</div>
                    <div className="min-w-0 flex-1"><p className="font-bold text-ink-900 truncate text-sm">{t.studentName}</p><p className="text-[11px] text-ink-400">ชั้น {shortGrade(t.grade)} เลขที่ {t.studentNo} · {fmtDT(t.createdAt)}</p></div>
                    <span className="text-xs bg-brand-50 text-brand-600 px-2.5 py-1 rounded-full font-bold whitespace-nowrap">+{t.hp||0} HP</span>
                  </div>
                  <div className={`mt-3 ${a?.tint||'bg-paper'} rounded-2xl p-3 flex items-center gap-2.5`}>
                    <i className={`fas ${a?.icon||'fa-star'} ${a?.text||'text-ink-500'}`}></i>
                    <span className="text-sm font-semibold text-ink-900">{t.activityName}</span>
                    {t.distance!=null && <span className="ml-auto text-sm font-bold text-ink-900 num">{t.distance} กม.</span>}
                  </div>
                  {(t.duration||t.avgPace!=null) && (
                    <div className="flex flex-wrap gap-1.5 mt-2">
                      {t.duration ? <Chip icon="fa-stopwatch" tone="slate" label={`${Math.round(t.duration/60)} นาที`}/> : null}
                      {t.avgPace!=null && <Chip icon="fa-gauge-high" tone={t.avgPace<3?'amber':'slate'} label={`${t.avgPace} นาที/กม.`}/>}
                    </div>
                  )}
                  {(t.imgBefore||t.imgAfter) && (
                    <div className="grid grid-cols-2 gap-2 mt-3">
                      {[['ก่อน',t.imgBefore,t.timeBefore],['หลัง',t.imgAfter,t.timeAfter]].map(([l,src,tm])=>src&&(
                        <div key={l} onClick={()=>setPreview(src)} className="press cursor-pointer">
                          <img src={src} className="w-full h-28 object-cover rounded-2xl" alt={l}/>
                          <p className="text-[10px] text-ink-400 mt-1.5 text-center">{l} · {fmtDT(tm)}</p>
                        </div>
                      ))}
                    </div>
                  )}
                  <div className="grid grid-cols-2 gap-2 mt-4">
                    <button onClick={()=>review(t.id,'rejected')} className="h-12 rounded-2xl bg-rose-50 text-rose-600 font-bold press text-sm"><i className="fas fa-xmark mr-1.5"></i>ปฏิเสธ</button>
                    <button onClick={()=>review(t.id,'approved')} className="h-12 rounded-2xl bg-brand-600 text-white font-bold press text-sm shadow-lift"><i className="fas fa-check mr-1.5"></i>อนุมัติ</button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </main>

      <nav className="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur-lg border-t border-slate-100 shadow-nav safe-b z-40">
        <div className="flex max-w-lg mx-auto">
          {(isStudent
            ? [['home','หน้าหลัก','fa-house'],['leaderboard','อันดับ','fa-trophy'],['history','ประวัติ','fa-clock-rotate-left']]
            : [['review','ตรวจงาน','fa-clipboard-check'],['scores','คะแนน','fa-ranking-star'],['leaderboard','อันดับ','fa-trophy']]
          ).map(([tab,label,ic])=>{
            const on = activeTab===tab || (tab==='home'&&activeTab==='activity');
            return (
              <button key={tab} onClick={()=>{ if(activeTab==='activity') resetActivity(); navigate(tab); }} className="flex-1 py-2.5 flex flex-col items-center gap-0.5 press">
                <span className={`w-11 h-8 rounded-full flex items-center justify-center transition-all ${on?'bg-brand-50':''}`}><i className={`fas ${ic} text-[17px] ${on?'text-brand-600':'text-ink-400'}`}></i></span>
                <span className={`text-[10px] font-semibold ${on?'text-brand-600':'text-ink-400'}`}>{label}</span>
              </button>
            );
          })}
        </div>
      </nav>
    </div>
  );
}

/* ============================================================
   5) UI COMPONENTS
============================================================ */
function Toast({toast}){
  if(!toast) return null; const ok=toast.type==='success';
  return (
    <div className="fixed bottom-24 inset-x-0 z-[60] flex justify-center px-6 pointer-events-none">
      <div className={`toast-up flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-lift text-white text-sm font-semibold max-w-xs ${ok?'bg-ink-900':'bg-rose-500'}`}>
        <i className={`fas ${ok?'fa-circle-check text-brand-400':'fa-circle-exclamation'} `}></i><span className="leading-snug">{toast.msg}</span>
      </div>
    </div>
  );
}
function ProgressRing({value,max,color,size=100,stroke=10,children}){
  const r=(size-stroke)/2, c=2*Math.PI*r, pct=Math.min(1,Math.max(0,(value||0)/(max||1)));
  return (
    <div className="relative flex-shrink-0" style={{width:size,height:size}}>
      <svg width={size} height={size} className="-rotate-90">
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#eef4f1" strokeWidth={stroke}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c*(1-pct)} style={{transition:'stroke-dashoffset .6s cubic-bezier(.3,.9,.3,1)'}}/>
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center">{children}</div>
    </div>
  );
}
const Field=({icon,type='text',value,onChange,placeholder})=>(
  <div className="relative">
    <i className={`fas ${icon} absolute left-4 top-1/2 -translate-y-1/2 text-ink-400 text-sm`}></i>
    <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} className="w-full h-14 pl-11 pr-4 rounded-2xl bg-paper border border-transparent focus:bg-white focus:border-brand-400 focus:ring-4 focus:ring-brand-100 outline-none text-ink-900 placeholder:text-ink-400 transition"/>
  </div>
);
const MiniStat=({icon,value,label,tone})=>(
  <div className="bg-paper rounded-2xl py-3 text-center">
    <p className={`text-xl font-bold num ${tone}`}><i className={`fas ${icon} text-[11px] text-ink-400 mr-1.5`}></i>{value}</p>
    <p className="text-[10px] text-ink-400 mt-0.5">{label}</p>
  </div>
);
const Chip=({icon,label,tone='slate'})=>{
  const t={brand:'bg-brand-50 text-brand-600',amber:'bg-amber-50 text-amber-600',slate:'bg-paper text-ink-500'}[tone];
  return <span className={`inline-flex items-center gap-1 text-[10px] font-semibold px-2.5 py-1 rounded-full ${t}`}><i className={`fas ${icon}`}></i>{label}</span>;
};
const SectionTitle=({icon,color,title,sub,flush})=>(
  <div className={`flex items-end justify-between ${flush?'':'px-1 mb-2.5'}`}>
    <div><h2 className="font-bold text-ink-900 text-[15px]"><i className={`fas ${icon} ${color} mr-2 text-sm`}></i>{title}</h2>{sub && <p className="text-[11px] text-ink-400 mt-0.5 ml-6">{sub}</p>}</div>
  </div>
);
const TaskRow=({t})=>{
  const a=actById(t.activityId);
  return (
    <div className="flex items-center gap-3 p-3 rounded-2xl hover:bg-paper transition">
      <div className={`w-10 h-10 rounded-xl ${a?.tint||'bg-paper'} flex items-center justify-center flex-shrink-0`}><i className={`fas ${a?.icon||'fa-star'} text-sm ${a?.text||'text-ink-500'}`}></i></div>
      <div className="flex-1 min-w-0"><p className="font-semibold text-sm text-ink-900 truncate">{t.activityName}</p><p className="text-[11px] text-ink-400">{fmtDT(t.createdAt)}{t.hp!=null?` · ${t.hp} HP`:''}</p></div>
      <StatusBadge s={t.status}/>
    </div>
  );
};
const StatusBadge=({s})=>{
  const m={approved:['bg-brand-50 text-brand-600','fa-check','อนุมัติ'], pending:['bg-amber-50 text-amber-600','fa-hourglass-half','รอตรวจ'], rejected:['bg-rose-50 text-rose-600','fa-xmark','ไม่ผ่าน']};
  const [cls,ic,txt]=m[s]||m.pending;
  return <span className={`text-[10px] px-2.5 py-1.5 rounded-full font-bold whitespace-nowrap flex-shrink-0 ${cls}`}><i className={`fas ${ic} mr-1`}></i>{txt}</span>;
};
const SkeletonList=()=><div className="space-y-2 mt-3">{[0,1,2].map(i=><div key={i} className="h-16 rounded-2xl shimmer"></div>)}</div>;
const EmptyInline=({text})=><div className="py-12 text-center"><i className="fas fa-inbox text-3xl text-ink-400/40"></i><p className="text-sm text-ink-400 mt-2">{text}</p></div>;
const EmptyCard=({icon,text,tone='text-ink-400/40'})=><div className="bg-white rounded-3xl shadow-card p-12 text-center fade-up"><i className={`fas ${icon} text-5xl ${tone}`}></i><p className="text-ink-500 mt-3 font-medium">{text}</p></div>;

function PhotoSlot({label,step,img,time,onPick,onView,onDelete,disabled,hint}){
  const id='f_'+step;
  return (
    <div>
      <p className="text-xs font-semibold text-ink-700 mb-2 flex items-center gap-1.5">
        <span className={`w-4 h-4 rounded-full text-[9px] flex items-center justify-center text-white ${img?'bg-brand-500':'bg-ink-400/50'}`}>{img?<i className="fas fa-check text-[7px]"></i>:step}</span>{label}
      </p>
      {img ? (
        <div className="relative group">
          <div onClick={()=>onView(img)} className="relative press cursor-pointer">
            <img src={img} className="w-full h-36 object-cover rounded-2xl" alt={label}/>
            <span className="absolute bottom-2 left-2 bg-black/65 text-white text-[9px] px-2 py-1 rounded-lg backdrop-blur-sm"><i className="fas fa-clock mr-1"></i>{fmtDT(time)}</span>
          </div>
          {onDelete && !disabled && (
            <button onClick={(e)=>{ e.stopPropagation(); onDelete(); }} className="absolute -top-2 -right-2 w-7 h-7 bg-rose-500 text-white rounded-full flex items-center justify-center shadow-md press">
              <i className="fas fa-trash-alt text-[10px]"></i>
            </button>
          )}
        </div>
      ) : (
        <label htmlFor={id} className={`h-36 rounded-2xl border-2 border-dashed flex flex-col items-center justify-center gap-1.5 transition ${disabled?'border-slate-200 bg-paper text-ink-400/50':'border-brand-300 bg-brand-50/50 text-brand-600 cursor-pointer active:scale-95'}`}>
          <i className="fas fa-camera text-2xl"></i><span className="text-[11px] font-semibold">{hint||'แตะเพื่อถ่ายรูป'}</span>
        </label>
      )}
      <input id={id} type="file" accept="image/*" capture="environment" disabled={disabled} onChange={onPick} className="hidden"/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
